<div class="container py-4">
  <h2 class="mb-4">Ajouter un album</h2>

  <form #albumForm="ngForm" (ngSubmit)="addAlbum()">
    <div class="mb-3">
      <label for="idAlbum" class="form-label">ID de l’album</label>
      <input
        id="idAlbum"
        type="number"
        [(ngModel)]="newAlbum.idAlbum"
        name="idAlbum"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <label for="titreAlbum" class="form-label">Titre de l’album</label>
      <input
        id="titreAlbum"
        type="text"
        [(ngModel)]="newAlbum.titreAlbum"
        name="titreAlbum"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <label for="genreMusical" class="form-label">Genre musical</label>
      <input
        id="genreMusical"
        type="text"
        [(ngModel)]="newAlbum.genreMusical"
        name="genreMusical"
        class="form-control"
        required
      />
    </div>

    <div class="mb-3">
      <label for="idArtist">Artiste</label>
      <select
        id="idArtist"
        [(ngModel)]="newIdArt"
        name="idArtist"
        class="form-control form-control-lg"
        required
      >
        <option [ngValue]="undefined" disabled>Choisir un artiste</option>
        @for (artist of artists; track artist.idArtist) {
          <option [ngValue]="artist.idArtist">{{ artist.nomArtist }}</option>
        }
      </select>
    </div>

    <div class="mb-3">
      <label for="dateAlbum" class="form-label">Date de création</label>
      <input
        id="dateAlbum"
        type="date"
        [(ngModel)]="dateAlbum"
        name="dateAlbum"
        class="form-control"
        required
      />
    </div>

    <button type="submit" class="btn btn-success" [disabled]="albumForm.invalid">
      Ajouter
    </button>
  </form>
</div>
