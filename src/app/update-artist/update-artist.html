<form>
  <div [hidden]="ajout">
    <label for="idArtist">ID Artiste</label>
    <input
      id="idArtist"
      type="number"
      [(ngModel)]="artist.idArtist"
      name="idArtist"
      class="form-control w-25"
    />
  </div>
  <div>
    <label for="nomArtist">Nom Artiste</label>
    <input
      id="nomArtist"
      type="text"
      [(ngModel)]="artist.nomArtist"
      name="nomArtist"
      class="form-control"
      placeholder="Entrez un nom d’artiste..."
    />
  </div>
  <div class="mt-2">
    <button
      type="submit"
      [disabled]="!artist.nomArtist"
      class="btn btn-success"
      (click)="saveArtist()"
    >
      {{ ajout ? 'Ajouter' : 'Modifier' }}
    </button>
  </div>
</form>
